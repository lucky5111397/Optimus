services:
  mongodb:
    image: mongo:latest
    container_name: optimus-mongodb
    ports:
      - "27017:27017"
    volumes:
      - optimus-mongo-data:/data/db
    networks:
      - optimus-backend-net

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.api
    container_name: optimus-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/optimus
      - WORKER_URL=http://worker:8080
      - WORKSPACES_ROOT=/app/workspaces
    volumes:
      - optimus-workspaces:/app/workspaces
    depends_on:
      - mongodb
      - worker
    networks:
      - optimus-backend-net
      - optimus-worker-net
      - optimus-frontend-net

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: optimus-worker
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /root/.npm:rw,size=128m
    environment:
      - PORT=8080
      - NODE_ENV=production
      - WORKSPACES_ROOT=/tmp/optimus_workspaces
    volumes:
      - optimus-workspaces:/tmp/optimus_workspaces:rw
    networks:
      - optimus-worker-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
          pids: 100

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: optimus-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - optimus-frontend-net

networks:
  optimus-backend-net:
    driver: bridge
  optimus-worker-net:
    driver: bridge
    internal: true
  optimus-frontend-net:
    driver: bridge

volumes:
  optimus-mongo-data:
  optimus-workspaces:
