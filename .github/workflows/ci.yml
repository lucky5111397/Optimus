name: OPTIMUS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Validation & Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/server.js

      - name: Run backend security tests
        run: npm test

      - name: Run deterministic mock benchmark
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/optimus_ci
          MONGODB_TIMEOUT_MS: 15000
          JWT_SECRET: ci-test-token-secret-deterministic
        run: npm run benchmark -- --mode=mock

      - name: Upload benchmark scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: backend/src/benchmark/reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build
